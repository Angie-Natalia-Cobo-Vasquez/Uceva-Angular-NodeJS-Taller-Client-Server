@switch (state) {
  @case ('loading') {
    <app-alert alertState="loading" text="Cargando música..."></app-alert>
  }
  @case ('error') {
    <app-alert alertState="error" text="Error al cargar la música"></app-alert>
  }
  @case ('success') {
    <app-musica-table [musica]="musica"></app-musica-table>
  }
}
