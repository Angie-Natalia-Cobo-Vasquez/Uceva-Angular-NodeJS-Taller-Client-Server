@switch (state) {
  @case ('loading') {
    <app-alert alertState="loading" text="Cargando vuelos..."></app-alert>
  }
  @case ('error') {
    <app-alert alertState="error" text="Error al cargar los vuelos"></app-alert>
  }
  @case ('success') {
    <app-vuelos-table [vuelos]="vuelos"></app-vuelos-table>
  }
}
